name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore HotelReservas.sln

      - name: Compilar
        run: dotnet build HotelReservas.sln --configuration Release --no-restore

      - name: Pruebas
        run: dotnet test HotelReservas.sln --configuration Release --no-build --verbosity normal
